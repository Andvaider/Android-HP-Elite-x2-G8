name: Build Android-x86 HP Elite x2 G8 Full Drivers

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip python3 openjdk-8-jdk

      - name: Setup Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Sync and Build Android 11 with Full Hardware Support
        run: |
          export PATH=~/bin:$PATH
          mkdir android-hp && cd android-hp
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Инициализация репозитория Bliss OS / Android 11 для ПК
          repo init -u https://github.com/BlissOS/platform_manifest.git -b android-11 --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

          source build/envsetup.sh
          lunch x86_64-userdebug

          # Глобальные параметры ядра: графика Iris Xe, датчики, батарея, звук, тач и Wacom перо
          export WITH_GAPPS=true
          export BOARD_KERNEL_CMDLINE="GPU=INTEL vulkan=intel iris=true i915.force_probe=4c8a i915.enable_guc=3 snd_intel_dspcfg.dsp_driver=3 swiotlb=max"

          m iso_img -j$(nproc)

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Android-11-HP-Elite-x2-G8-Full-ISO
          path: android-hp/out/target/product/x86_64/*.iso
