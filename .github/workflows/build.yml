name: Build Android 13 x86_64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip python3 openjdk-11-jdk bc rsync

      - name: Setup Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Sync and Build Android 13
        run: |
          export PATH=~/bin:$PATH
          mkdir android-13 && cd android-13
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          repo init -u https://github.com/android-x86/manifest.git -b android-13.0.0 --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

          source build/envsetup.sh
          lunch x86_64-userdebug

          export BOARD_KERNEL_CMDLINE="GPU=INTEL vulkan=intel iris=true i915.force_probe=4c8a i915.enable_guc=3 snd_intel_dspcfg.dsp_driver=3 swiotlb=max"

          m iso_img -j$(nproc)

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Android-13-HP-Elite-x2-G8-ISO
          path: android-13/out/target/product/x86_64/*.iso
