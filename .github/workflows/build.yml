name: Build Android-x86 r-x86 HP Elite x2 G8

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean
          df -h

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libc6-dev-i386 libncurses5 x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip python3 openjdk-8-jdk

      - name: Setup Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo

      - name: Sync and Build Android-x86
        run: |
          export PATH=~/bin:$PATH
          mkdir android-x86 && cd android-x86
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          # Используем официальный стабильный репозиторий android-x86 (ветка r-x86 для Android 11)
          repo init -u https://github.com/android-x86/manifest.git -b r-x86 --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

          source build/envsetup.sh
          lunch x86_64-userdebug

          # Параметры ядра для HP Elite x2 G8
          export BOARD_KERNEL_CMDLINE="GPU=INTEL vulkan=intel iris=true i915.force_probe=4c8a i915.enable_guc=3 snd_intel_dspcfg.dsp_driver=3 swiotlb=max"

          m iso_img -j$(nproc)

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: Android-11-x86-HP-Elite-x2-G8-ISO
          path: android-x86/out/target/product/x86_64/*.iso
